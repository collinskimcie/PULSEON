; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-dev

[env:esp32-s3-dev]
platform =https://github.com/platformio/platform-espressif32.git
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
framework = arduino
platform_packages = 
	framework-arduinoespressif32 @ ~4.30312.0
	platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12
	platformio/toolchain-xtensa-esp-elf@14.2.0+20241119
monitor_speed = 115200
lib_deps = 
	lvgl/lvgl @ 9.5.0
	fbiego/ESP32Time @ ^2.0.6
	h2zero/NimBLE-Arduino @ 2.5.1
	esp-lib-utils @ ^0.2.0
	file://../PULSEON_WATCH_UI
build_unflags = 
	-std=gnu++11
	-std=c++11
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX24320028E_WB_A
	-I include
    -I .
	-I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/freertos/config/include
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/freertos/config/include/freertos
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/freertos/config/xtensa/include
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/xtensa
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/freertos/FreeRTOS-Kernel/include
	-I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/esp_common/include
	-I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/bt/include/esp32c3/include
	-I .pio/libdeps/esp32-s3-dev
	-I .pio/libdeps/esp32-s3-dev/lvgl
	-I .pio/libdeps/esp32-s3-dev/lvgl/src
	-DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -include include/lvgl_compat.h
	-std=gnu++17

; Wireless upload. First: export PULSEON_OTA_PASS=<the OTA_PASSWORD from wifi_secrets.h>
; Then: pio run -e esp32-s3-ota -t upload   (or add --upload-port <watch IP>)
[env:esp32-s3-ota]
extends = env:esp32-s3-dev
upload_protocol = espota
upload_port = pulseon.local
upload_flags =
    --auth=${sysenv.PULSEON_OTA_PASS}
