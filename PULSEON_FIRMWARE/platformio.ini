; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-dev

[env:esp32-s3-dev]
platform =https://github.com/platformio/platform-espressif32.git
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
framework = arduino
platform_packages = 
	framework-arduinoespressif32 @ 4.30312.261001
	platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12
	platformio/toolchain-xtensa-esp-elf@14.2.0+20241119
monitor_speed = 115200
lib_deps = 
	lvgl/lvgl @ 9.5.0
	fbiego/ESP32Time @ ^2.0.6
	h2zero/NimBLE-Arduino @ 2.1.0
	esp-lib-utils @ ^0.2.0
build_unflags = 
	-std=gnu++11
	-std=c++11
build_flags =
    -DBOARD_HAS_PSRAM
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX24320028E_WB_A
	-I include
    -I .
	-I .pio/libdeps/esp32-s3-dev
	-I .pio/libdeps/esp32-s3-dev/lvgl
	-I .pio/libdeps/esp32-s3-dev/lvgl/src
	-DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -include include/lvgl_compat.h
	-std=gnu++17
